name: Motuka Admin - validation Lot 1

on:
  push:
    branches:
      - feature/admin-security-partners
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify dependency lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Validate security smoke-test script syntax
        run: node --check scripts/test-admin-access.mjs
      - name: Build
        run: npm run build
        env:
          CI: 'true'
