name: Motuka Admin - validation Lot 1

on:
  push:
    branches:
      - feature/admin-security-partners
      - feature/commissionnaire-c2-admin
      - fix/c2-audit-history-pagination
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify dependency lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Validate security smoke-test script syntax
        run: node --check scripts/test-admin-access.mjs
      - name: Validate fictional emulator seed syntax\n        run: node --check scripts/seed-c2-emulator.mjs\n      - name: C2 emulator safety guard tests (no network)\n        run: node --test tests/c2EmulatorSafety.test.mjs\n      - name: C2 HTTP smoke safety guard tests (no network)\n        run: node --test tests/c2HttpSmokeSafety.test.mjs\n      - name: C2 decision policy unit tests
        run: node --test tests/partnerDecisionPolicy.test.mjs
      - name: Validate C2 emulator test syntax (no production connection)
        run: node --check tests/partnerDecisionEmulator.test.mjs
      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: C2 Firestore Emulator integration tests (isolated demo project)
        env:
          GCLOUD_PROJECT: demo-motuka-c2
        run: |
          printf '{"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}}}\n' > /tmp/motuka-c2-firebase.json
          npx --yes firebase-tools@14 emulators:exec --config /tmp/motuka-c2-firebase.json --only firestore --project demo-motuka-c2 'node --test tests/partnerDecisionEmulator.test.mjs'
      - name: C2 fictional accounts seed in isolated Auth and Firestore emulators
        env:
          GCLOUD_PROJECT: demo-motuka-c2
          GOOGLE_CLOUD_PROJECT: demo-motuka-c2
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          npx --yes firebase-tools@14 emulators:exec --config firebase.c2.test.json --only auth,firestore --project demo-motuka-c2 'node scripts/seed-c2-emulator.mjs'
      - name: C2 isolated HTTP authorization smoke tests
        env:
          GCLOUD_PROJECT: demo-motuka-c2
          GOOGLE_CLOUD_PROJECT: demo-motuka-c2
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          NEXT_PUBLIC_C2_EMULATOR_MODE: 'true'
        run: |
          npx --yes firebase-tools@14 emulators:exec --config firebase.c2.test.json --only auth,firestore --project demo-motuka-c2 'node scripts/run-c2-local-http.mjs'
      - name: Build
        run: npm run build
        env:
          CI: 'true'
